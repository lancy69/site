when:
  - event: [push, manual]
    branch: [main]

engine: nixery

dependencies:
  nixpkgs:
    - gnumake
    - nodejs
  nixpkgs/nixpkgs-unstable:
    - typst

steps:
  - name: Build site
    command: make pub

  - name: Deploy to Cloudflare Pages
    command: npx --yes wrangler@4 pages deploy dist --project-name=site --branch=main
